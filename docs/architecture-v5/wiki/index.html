<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SASTSIMI Architecture v5 Wiki">
  <title>SASTSIMI Architecture v5</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="app">Architecture v5 Wiki를 불러오는 중입니다.</div>
  <script>
    window.$docsify = {
      name: 'SASTSIMI Architecture v5',
      basePath: '../',
      homepage: 'wiki/README.md',
      loadSidebar: 'wiki/_Sidebar.md',
      alias: {
        '/README': '/README.md',
        '/quick-guide': '/wiki/quick-guide.md',
        '/pipeline': '/wiki/pipeline.md',
        '/agents': '/wiki/agents.md',
        '/verification-and-dynamic': '/wiki/verification-and-dynamic.md',
        '/gate-and-reporting': '/wiki/gate-and-reporting.md',
        '/chaining': '/wiki/chaining.md',
        '/providers-and-logging': '/wiki/providers-and-logging.md',
        '/results': '/wiki/results.md',
        '/diagrams': '/wiki/diagrams.md'
      },
      auto2top: true,
      relativePath: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: 'auto'
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral' });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
