rules:
  - id: sastsimi.javascript.auth-check
    languages: [javascript]
    message: Candidate authentication check; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: $APP.use($AUTH)
      - pattern: $ROUTER.use($AUTH)
      - pattern: $AUTH($REQ, $RES, $NEXT)

  - id: sastsimi.javascript.command-sink
    languages: [javascript]
    message: Candidate command-execution sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execFile(...)
      - pattern: child_process.spawn(...)
      - pattern: $CP.exec(...)
      - pattern: $CP.execFile(...)
      - pattern: $CP.spawn(...)

  - id: sastsimi.javascript.dom-xss-sink
    languages: [javascript]
    message: Candidate browser HTML sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: $EL.innerHTML = $VALUE
      - pattern: document.write(...)
      - pattern: document.writeln(...)

  - id: sastsimi.javascript.permission-check
    languages: [javascript]
    message: Candidate permission check; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: $USER.hasPermission(...)
      - pattern: $USER.hasRole(...)
      - pattern: $AUTHZ.can(...)
      - pattern: $AUTHZ.authorize(...)

  - id: sastsimi.javascript.request-source
    languages: [javascript]
    message: Candidate web-request source; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: $REQ.body
      - pattern: $REQ.body.$FIELD
      - pattern: $REQ.query
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.params
      - pattern: $REQ.params.$FIELD
      - pattern: $REQ.headers[$KEY]

  - id: sastsimi.javascript.sanitizer
    languages: [javascript]
    message: Candidate output sanitizer; effectiveness requires verification.
    severity: INFO
    pattern-either:
      - pattern: encodeURIComponent(...)
      - pattern: $SANITIZER.sanitize(...)
      - pattern: $ESCAPE(...)

  - id: sastsimi.javascript.sql-sink
    languages: [javascript]
    message: Candidate database-query sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: $DB.query(...)
      - pattern: $DB.execute(...)
      - pattern: $CONNECTION.query(...)
      - pattern: $CONNECTION.execute(...)

  - id: sastsimi.javascript.validator
    languages: [javascript]
    message: Candidate input validator; effectiveness requires verification.
    severity: INFO
    pattern-either:
      - pattern: $SCHEMA.validate(...)
      - pattern: $VALIDATOR.isValid(...)
      - pattern: $VALIDATOR.matches(...)

  - id: sastsimi.python.auth-check
    languages: [python]
    message: Candidate authentication check; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: login_required(...)
      - pattern: authenticate(...)
      - pattern: $BACKEND.authenticate(...)
      - pattern: $REQUEST.user.is_authenticated

  - id: sastsimi.python.command-sink
    languages: [python]
    message: Candidate command-execution sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: subprocess.run(...)
      - pattern: subprocess.call(...)
      - pattern: subprocess.Popen(...)
      - pattern: subprocess.check_call(...)
      - pattern: subprocess.check_output(...)

  - id: sastsimi.python.html-sink
    languages: [python]
    message: Candidate server-side HTML sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: mark_safe(...)
      - pattern: django.utils.safestring.mark_safe(...)
      - pattern: render_template_string(...)

  - id: sastsimi.python.http-method-handler
    languages: [python]
    message: Candidate HTTP method entry in a direct BaseHTTPRequestHandler subclass.
    severity: INFO
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $HANDLER(BaseHTTPRequestHandler):
                  ...
          - pattern-inside: |
              class $HANDLER(http.server.BaseHTTPRequestHandler):
                  ...
      - pattern-either:
          - pattern: |
              def do_GET(...):
                  ...
          - pattern: |
              def do_POST(...):
                  ...
          - pattern: |
              def do_PUT(...):
                  ...
          - pattern: |
              def do_PATCH(...):
                  ...
          - pattern: |
              def do_DELETE(...):
                  ...
          - pattern: |
              def do_HEAD(...):
                  ...
          - pattern: |
              def do_OPTIONS(...):
                  ...

  - id: sastsimi.python.http-client-sink
    languages: [python]
    message: Candidate outbound HTTP sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: requests.put(...)
      - pattern: requests.patch(...)
      - pattern: requests.delete(...)
      - pattern: $SESSION.request(...)

  - id: sastsimi.python.path-sink
    languages: [python]
    message: Candidate filesystem-path sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: open(...)
      - pattern: pathlib.Path(...).open(...)
      - pattern: send_file(...)

  - id: sastsimi.python.permission-check
    languages: [python]
    message: Candidate permission check; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: permission_required(...)
      - pattern: $USER.has_perm(...)
      - pattern: $USER.has_perms(...)
      - pattern: $REQUEST.user.has_perm(...)

  - id: sastsimi.python.query-parse-source
    languages: [python]
    message: Candidate request-query parser; request provenance requires verification.
    severity: INFO
    pattern-either:
      - pattern: parse_qs($REQUEST.query_string)
      - pattern: parse_qsl($REQUEST.query_string)
      - pattern: urllib.parse.parse_qs($REQUEST.query_string)
      - pattern: urllib.parse.parse_qsl($REQUEST.query_string)
      - pattern: parse_qs(urlparse($REQUEST.path).query)
      - pattern: parse_qsl(urlparse($REQUEST.path).query)
      - pattern: urllib.parse.parse_qs(urllib.parse.urlparse($REQUEST.path).query)
      - pattern: urllib.parse.parse_qsl(urllib.parse.urlparse($REQUEST.path).query)
      - patterns:
          - pattern-either:
              - pattern: $PARSER.parse_qs($PARSED.query)
              - pattern: $PARSER.parse_qsl($PARSED.query)
          - pattern-inside: |
              $PARSED = $PARSER.urlparse($REQUEST.path)
              ...

  - id: sastsimi.python.request-source
    languages: [python]
    message: Candidate web-request source; not a vulnerability verdict.
    severity: INFO
    metadata:
      candidate_kind: ENTRY_POINT
    pattern-either:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.json
      - pattern: request.get_json(...)
      - pattern: request.cookies.get(...)
      - pattern: request.cookies[$KEY]
      - pattern: request.headers.get(...)
      - pattern: request.headers[$KEY]
      - pattern: $REQUEST.GET.get(...)
      - pattern: $REQUEST.POST.get(...)
      - pattern: $REQUEST.GET[$KEY]
      - pattern: $REQUEST.POST[$KEY]
      - pattern: await $REQUEST.post()
      - pattern: await $REQUEST.json()
      - pattern: "@$APP.post(...)"
      - pattern: "@$APP.get(...)"
      - pattern: "@$APP.put(...)"
      - pattern: "@$APP.patch(...)"
      - pattern: "@$APP.delete(...)"

  - id: sastsimi.python.sanitizer
    languages: [python]
    message: Candidate output sanitizer; effectiveness requires verification.
    severity: INFO
    pattern-either:
      - pattern: escape(...)
      - pattern: html.escape(...)
      - pattern: django.utils.html.escape(...)
      - pattern: bleach.clean(...)

  - id: sastsimi.python.deserialization-sink
    languages: [python]
    message: Candidate unsafe deserialization call; input provenance requires verification.
    severity: INFO
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: dill.load(...)
      - pattern: dill.loads(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)

  - id: sastsimi.python.identity-cookie-write
    languages: [python]
    message: Candidate identity-cookie write; fixation and cookie safety require verification.
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: $RESPONSE.set_cookie($KEY, ...)
          - pattern: $RESPONSE.cookie[$KEY] = $VALUE
          - patterns:
              - pattern: $COOKIE[$KEY] = $VALUE
              - pattern-inside: |
                  $COOKIE = $RESPONSE.cookie
                  ...
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i)^(["''])(?:session(?:[_-]?id)?|auth|authentication|access_token|refresh_token|id_token|jwt|identity|user_id)\1$'

  - id: sastsimi.python.redirect-sink
    languages: [python]
    message: Candidate dynamic redirect target; external control requires verification.
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: redirect($TARGET)
          - pattern: HttpResponseRedirect($TARGET)
          - pattern: $HANDLER.send_header('Location', $TARGET)
          - pattern: $HANDLER.send_header("Location", $TARGET)
      - metavariable-regex:
          metavariable: $TARGET
          regex: '^(?:(?!(?:[rRuUbBfF]*["''])).+|[fF]["''].*\{[^}]+\}.*)$'

  - id: sastsimi.python.session-identity-write
    languages: [python]
    message: Candidate session identity write; rotation and fixation risk require verification.
    severity: INFO
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $SESSION[$KEY] = $VALUE
              - pattern-inside: |
                  $SESSION = await get_session(...)
                  ...
          - patterns:
              - pattern: $REQUEST.session[$KEY] = $VALUE
              - metavariable-regex:
                  metavariable: $REQUEST
                  regex: '^(?:request|req|http_request)$'
          - patterns:
              - pattern: $SESSION[$KEY] = $VALUE
              - metavariable-regex:
                  metavariable: $SESSION
                  regex: '^session$'
      - metavariable-regex:
          metavariable: $KEY
          regex: '^["''](?:user(?:_id|name)?|account_id|principal(?:_id)?|identity(?:_id)?|subject_id|uid|email)["'']$'

  - id: sastsimi.python.sql-sink
    languages: [python]
    message: Candidate database-query sink; not a vulnerability verdict.
    severity: INFO
    pattern-either:
      - pattern: $CURSOR.execute(...)
      - pattern: $CURSOR.executemany(...)
      - pattern: $MODEL.objects.raw(...)
      - pattern: $CONNECTION.execute(...)

  - id: sastsimi.python.weak-password-hash
    languages: [python]
    message: Candidate password-like value passed to MD5 or SHA-1; context requires verification.
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: md5($PASSWORD.encode(...)).hexdigest()
          - pattern: hashlib.md5($PASSWORD.encode(...)).hexdigest()
          - pattern: sha1($PASSWORD.encode(...)).hexdigest()
          - pattern: hashlib.sha1($PASSWORD.encode(...)).hexdigest()
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: (?i).*(?:password|passwd|passphrase|pwd).*

  - id: sastsimi.python.validator
    languages: [python]
    message: Candidate input validator; effectiveness requires verification.
    severity: INFO
    pattern-either:
      - pattern: re.fullmatch(...)
      - pattern: $REGEX.fullmatch(...)
      - pattern: $SCHEMA.validate(...)
      - pattern: $FORM.is_valid(...)
